<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>DMI DeLMS</title><style>
:root{--navy:#12304a;--blue:#1769aa;--teal:#148a8a;--bg:#f5f7fa;--surface:#fff;--text:#202b36;--muted:#687585;--border:#e1e7ed;--shadow:0 18px 48px #12304a29}*{box-sizing:border-box}body{margin:0;font:15px/1.5 Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 15%,#2585bd,transparent 34%),linear-gradient(135deg,#0d2c47,#1769aa)}.login-card{width:min(100%,380px);padding:18px 26px;border-radius:16px;background:#fff;box-shadow:0 24px 70px #06162755;animation:enter .5s ease both}.brand{display:flex;align-items:center;gap:11px;font-weight:800;color:var(--navy)}.logo{width:40px;height:40px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--teal),var(--blue));border-radius:12px;font-size:12px}h1{font-size:24px;letter-spacing:-.04em;margin:11px 0 1px}.sub{color:var(--muted);margin:0 0 10px}label{display:block;margin:8px 0 4px;font-weight:650}input{width:100%;border:1px solid var(--border);border-radius:10px;padding:8px 11px;outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1769aa1b}.primary{border:0;border-radius:10px;background:linear-gradient(135deg,var(--blue),#0f578f);color:#fff;padding:8px 14px;font-weight:700;box-shadow:0 7px 15px #1769aa36;transition:.18s}.primary:hover{transform:translateY(-1px);box-shadow:0 10px 20px #1769aa42}.demo{margin-top:10px;padding:8px 10px;border-radius:10px;background:#edf8f7;border:1px solid #d2ece9;color:#25575c;font-size:13px}.app{display:grid;grid-template-columns:246px 1fr;min-height:100vh}.sidebar{background:var(--navy);padding:21px 12px;color:#dceaf3}.sidebar .brand{color:#fff;padding:0 10px 24px}.nav button{width:100%;display:flex;gap:11px;border:0;padding:10px 12px;margin:2px 0;color:inherit;background:transparent;text-align:left;border-radius:8px;transition:.18s}.nav button:hover,.nav button.active{background:#ffffff1f;color:#fff}.nav button:before{content:'•';color:#75c8c4;font-size:20px;line-height:10px}.main{min-width:0}.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:#fff;border-bottom:1px solid var(--border)}.topbar h2{font-size:18px;margin:0}.controls{display:flex;gap:9px}.controls select,.chat-select{border:1px solid var(--border);padding:7px 9px;border-radius:8px;color:var(--text);background:#fff}.content{padding:30px;max-width:1280px;margin:auto}.notice{background:#eaf4ff;border:1px solid #cce4ff;border-radius:10px;color:#185a91;padding:11px 14px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px;margin-top:20px}.panel{grid-column:span 4;background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px}.panel.wide{grid-column:span 8}.panel h3{margin:0 0 10px;font-size:16px}.course{padding:14px 0;border-top:1px solid var(--border)}.course:first-of-type{border:0}.bar{height:7px;border-radius:99px;background:#e8eef3;overflow:hidden}.bar i{height:100%;display:block;border-radius:inherit;background:linear-gradient(90deg,var(--teal),#4abcb6)}.metric{font-size:31px;color:var(--navy);font-weight:800}.chat-launch{position:fixed;z-index:5;right:25px;bottom:25px;width:62px;height:62px;border:0;border-radius:19px;display:grid;place-items:center;background:linear-gradient(145deg,var(--teal),#0c6d75);color:#fff;box-shadow:0 12px 27px #148a8a57;transition:.2s}.chat-launch:hover{transform:translateY(-3px) rotate(-3deg);box-shadow:0 17px 32px #148a8a70}.chat-launch svg{width:26px}.chat-launch:active{transform:scale(.94)}.chat{position:fixed;z-index:6;right:25px;bottom:102px;width:min(430px,calc(100vw - 32px));height:min(630px,calc(100vh - 124px));display:flex;flex-direction:column;background:#fff;border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);opacity:0;transform:translateY(16px) scale(.98);pointer-events:none;transition:.22s}.chat.open{opacity:1;transform:none;pointer-events:auto}.chat-head{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;color:#fff;background:linear-gradient(125deg,var(--navy),#1c5d83)}.assistant-title{display:flex;gap:10px;align-items:center}.assistant-title strong{display:block;font-size:14px}.assistant-title small{display:block;color:#bde5de;font-size:11px}.assistant-icon{width:33px;height:33px;display:grid;place-items:center;background:#ffffff1c;border:1px solid #ffffff2e;border-radius:10px}.chat-actions{display:flex;align-items:center;gap:7px}.chat-head button{color:#fff;background:transparent;border:0;font-size:20px}.chat-select{font-size:12px;padding:5px}.chat-body{flex:1;overflow:auto;padding:17px;background:linear-gradient(#fbfdff,#f4f8fa)}.chat-intro{color:var(--muted);font-size:12px;margin:0 0 14px}.message{width:fit-content;max-width:88%;padding:10px 12px;margin:9px 0;border-radius:4px 13px 13px;background:#e8f1f6;color:#294354;animation:messageIn .24s ease both}.message.user{margin-left:auto;border-radius:13px 4px 13px 13px;color:#174e4a;background:#d8f0ed}.typing{display:flex;gap:4px;width:fit-content;padding:12px;margin:9px 0;background:#e8f1f6;border-radius:4px 13px 13px}.typing i{width:5px;height:5px;border-radius:50%;background:#66818f;animation:dot 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}.suggestions{display:flex;flex-wrap:wrap;gap:7px;padding:0 16px 12px;background:#f4f8fa}.suggestions button{border:1px solid #cfe6e3;background:#fff;color:#147676;border-radius:99px;padding:6px 9px;font-size:12px}.chat-form{display:flex;gap:9px;padding:12px;border-top:1px solid var(--border);background:#fff}.chat-form input{padding:11px 12px}.send{width:44px;border:0;border-radius:10px;display:grid;place-items:center;background:var(--blue);color:#fff;transition:.18s}.send:hover{background:var(--navy);transform:translateY(-1px)}.send svg{width:19px}@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes messageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes dot{0%,80%,100%{transform:translateY(0);opacity:.45}40%{transform:translateY(-4px);opacity:1}}@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{display:none}.content{padding:20px}.topbar{padding:0 20px}.panel,.panel.wide{grid-column:span 12}.topbar h2{font-size:16px}.chat{right:16px;bottom:90px}.chat-launch{right:16px;bottom:16px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
 </style><style>
  .message.user { color: #fff; background: var(--blue); box-shadow: 0 3px 9px #1769aa26; }
  /* The static chat structure never replays animations after a re-render. */
  .message { animation: none; }
  .message.new { animation: messageIn .28s cubic-bezier(.2,.8,.2,1) both; }
  .chat { visibility: hidden; transition: opacity .26s cubic-bezier(.2,.8,.2,1), transform .26s cubic-bezier(.2,.8,.2,1), visibility 0s linear .26s; }
  .chat.open { visibility: visible; transition-delay: 0s; }
  .chat-launch { transition: transform .22s cubic-bezier(.2,.8,.2,1), box-shadow .22s ease; }
</style></head><body><div id="root"></div><script>
const icon={assistant:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0-6 6v3a4 4 0 0 0 4 4h1l1 3 2-3h1a4 4 0 0 0 4-4V9a6 6 0 0 0-6-6Z"/><path d="M9 10h.01M15 10h.01"/></svg>',send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>'};const saved=JSON.parse(localStorage.getItem('delms-chat')||'[]');const state={logged:false,page:'Dashboard',language:'ENG',chatOpen:false,messages:saved};const nav=['Dashboard','My Courses','Course Catalogue','Learning Materials','Assignments','Quizzes','Grades','Calendar','Messages','Notifications','Help and Support','AI Learning Assistant','Chatbot Evaluation','Profile and Settings','Branding and Appearance'];const courses=['Navigation and Seamanship','Maritime Safety Management','Marine Engineering Fundamentals'];const isSw=()=>state.language==='SW';function reply(q){q=q.toLowerCase();const sw=isSw();if(q.includes('assignment')||q.includes('kazi'))return sw?'Kuwasilisha kazi: fungua Kazi, chagua kazi husika, andika jibu lako, kisha bonyeza Wasilisha. Huu ni mchakato wa majaribio.':'To submit an assignment: open Assignments, choose the activity, enter your response, then select Submit. This is a demonstration workflow.';if(q.includes('quiz')||q.includes('jaribio'))return sw?'Fungua Majaribio na uchague jaribio linalopatikana. Unaweza kuhamia kati ya maswali na kuwasilisha ukimaliza.':'Open Quizzes and choose an available quiz. You can move between questions and submit when finished.';return sw?'Ninaweza kusaidia kuhusu kozi, kazi na majaribio. Jaribu kuuliza: “Ninawasilishaje kazi?”':'I can help with courses, assignments, and quizzes. Try asking: “How do I submit an assignment?”'}function save(){localStorage.setItem('delms-chat',JSON.stringify(state.messages));localStorage.setItem('delms-language',state.language)}function setLanguage(v){state.language=v;save();render()}function login(){state.logged=true;render()}function resetChat(){state.messages=[];state.language='ENG';localStorage.removeItem('delms-chat');localStorage.setItem('delms-language','ENG')}function logout(){state.logged=false;resetChat();render()}function go(p){state.page=p;render()}function send(e){e.preventDefault();const i=e.currentTarget.querySelector('input'),t=i.value.trim();if(!t)return;state.messages.push({role:'user',text:t});save();i.value='';render();setTimeout(()=>{state.messages.push({role:'assistant',text:reply(t)});save();render()},520)}function quickAsk(t){state.messages.push({role:'user',text:t});save();render();setTimeout(()=>{state.messages.push({role:'assistant',text:reply(t)});save();render()},520)}function chat(){const sw=isSw(),welcome=sw?'Habari! Ninaweza kukusaidia vipi leo?':'Hello! How can I help you today?',s=sw?['Ninawasilishaje kazi?','Jaribio langu liko wapi?']:['How do I submit an assignment?','Where is my quiz?'],messages=state.messages.length?state.messages.map(m=>`<div class="message ${m.role==='user'?'user':''}">${m.text}</div>`).join(''):`<p class="chat-intro">${welcome}</p>`;return `<button class="chat-launch" aria-label="Open DMI Learning Assistant" onclick="state.chatOpen=!state.chatOpen;render()">${icon.assistant}</button><section class="chat ${state.chatOpen?'open':''}"><header class="chat-head"><div class="assistant-title"><span class="assistant-icon">${icon.assistant}</span><span><strong>DMI Learning Assistant</strong><small>${sw?'Mfumo wa majaribio uko tayari':'Demo assistant online'}</small></span></div><div class="chat-actions"><select class="chat-select" aria-label="Chat language" onchange="setLanguage(this.value)"><option value="ENG" ${!sw?'selected':''}>ENG</option><option value="SW" ${sw?'selected':''}>SW</option></select><button aria-label="Minimize assistant" title="Minimize" data-chat-minimize>−</button><button aria-label="Close assistant" title="Close" data-chat-close>×</button></div></header><div class="chat-body" id="chat-body">${messages}</div><div class="suggestions">${s.map(x=>`<button onclick="quickAsk('${x}')">${x}</button>`).join('')}</div><form class="chat-form" onsubmit="send(event)"><input aria-label="Message" placeholder="${sw?'Andika ujumbe wako...':'Type your message...'}"><button class="send" aria-label="Send message">${icon.send}</button></form></section>`}function dashboard(){return `<div class="notice">Demonstration data only — this prototype is not connected to official DMI records.</div><div class="grid"><section class="panel wide"><h3>Welcome back, Asha</h3><p class="sub">Continue your maritime learning journey.</p>${courses.map((c,i)=>`<div class="course"><b>${c}</b><p>${[72,48,30][i]}% complete</p><div class="bar"><i style="width:${[72,48,30][i]}%"></i></div></div>`).join('')}</section><section class="panel"><h3>Pending work</h3><div class="metric">3</div><p class="sub">Assignments due this week</p><button class="primary" onclick="go('Assignments')">View assignments</button></section><section class="panel"><h3>Upcoming quiz</h3><b>COLREG Regulations</b><p class="sub">Available until 28 October</p><button class="primary" onclick="go('Quizzes')">Open quizzes</button></section></div>`}function page(){if(state.page==='Dashboard')return dashboard();if(state.page==='My Courses'||state.page==='Course Catalogue')return `<div class="grid">${courses.map((c,i)=>`<section class="panel"><h3>${c}</h3><p class="sub">MAR ${101+i} · Demo course</p><div class="bar"><i style="width:${[72,48,30][i]}%"></i></div><p>${[72,48,30][i]}% progress</p><button class="primary">Open course</button></section>`).join('')}</div>`;if(state.page==='Assignments')return `<section class="panel wide"><h3>Assignments</h3><p>Bridge Watchkeeping Reflection · Due 27 October · <b>Pending</b></p><p>Safety Case Study · Due 31 October · <b>Pending</b></p><label>Demo text submission</label><input placeholder="Write your response"><button class="primary" style="margin-top:12px">Submit</button></section>`;if(state.page==='AI Learning Assistant')return `<section class="panel wide"><h3>DMI Learning Assistant</h3><p>This page shares the floating assistant's local demonstration engine. Open it in the lower-right corner.</p><button class="primary" onclick="state.chatOpen=true;render()">Open assistant</button></section>`;return `<section class="panel wide"><h3>${state.page}</h3><p class="sub">This demonstration page is ready for local prototype content and interactions.</p><div class="notice">All information shown is fictional demonstration data.</div></section>`}function render(){document.getElementById('root').innerHTML=!state.logged?`<main class="login"><section class="login-card"><div class="brand"><span class="logo">DMI</span><span>DMI DeLMS</span></div><h1>Welcome back</h1><p class="sub">Sign in to the e-learning demonstration.</p><label>Email or username</label><input value="student@demo.delms"><label>Password</label><input type="password" value="demo123"><button class="primary" style="width:100%;margin-top:14px" onclick="login()">Log in</button><div class="demo"><b>Demo accounts</b><br>Student: student@demo.delms<br>Lecturer: lecturer@demo.delms<br>Administrator: admin@demo.delms<br>Password: demo123</div></section></main>`:`<div class="app"><aside class="sidebar"><div class="brand"><span class="logo">DMI</span><span>DMI DeLMS</span></div><nav class="nav">${nav.map(x=>`<button class="${state.page===x?'active':''}" onclick="go('${x}')">${x}</button>`).join('')}<button onclick="logout()">Logout</button></nav></aside><main class="main"><header class="topbar"><h2>${state.page}</h2><div class="controls"><select><option>Student</option><option>Lecturer</option><option>Administrator</option></select><select onchange="setLanguage(this.value)"><option value="ENG" ${!isSw()?'selected':''}>ENG</option><option value="SW" ${isSw()?'selected':''}>SW</option></select></div></header><div class="content">${page()}</div></main></div>${chat()}`;setTimeout(()=>{const b=document.getElementById('chat-body');if(b)b.scrollTop=b.scrollHeight},0)}render();
</script><script>
  icon.assistant = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7Z"/><path d="m18 16 .7 2.3L21 19l-2.3.7L18 22l-.7-2.3L15 19l2.3-.7Z"/></svg>';

  function appendMessage(role, text) {
    const body = document.getElementById('chat-body');
    if (!body) return;
    if (body.querySelector('.chat-intro')) body.innerHTML = '';
    const bubble = document.createElement('div');
    bubble.className = `message ${role === 'user' ? 'user ' : ''}new`;
    bubble.textContent = text;
    body.appendChild(bubble);
    body.scrollTop = body.scrollHeight;
  }

  function showTyping() {
    const body = document.getElementById('chat-body');
    const typing = document.createElement('div');
    typing.id = 'typing';
    typing.className = 'typing';
    typing.innerHTML = '<i></i><i></i><i></i>';
    body.appendChild(typing);
    body.scrollTop = body.scrollHeight;
  }

  function toggleAssistant(open) {
    const panel = document.querySelector('.chat');
    if (!panel) return;
    const shouldOpen = typeof open === 'boolean' ? open : !panel.classList.contains('open');
    state.chatOpen = shouldOpen;
    panel.classList.remove('open');
    if (shouldOpen) requestAnimationFrame(() => panel.classList.add('open'));
  }

  document.addEventListener('click', event => {
    const launcher = event.target.closest('.chat-launch');
    const closeButton = event.target.closest('[data-chat-close]');
    const minimizeButton = event.target.closest('[data-chat-minimize]');
    if (launcher || closeButton || minimizeButton) {
      event.preventDefault();
      event.stopImmediatePropagation();
      if (closeButton) { resetChat(); toggleAssistant(false); render(); }
      else if (minimizeButton) toggleAssistant(false);
      else toggleAssistant(undefined);
    }
  }, true);

  document.addEventListener('submit', event => {
    if (!event.target.matches('.chat-form')) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    const input = event.target.querySelector('input');
    const text = input.value.trim();
    if (!text) return;
    state.messages.push({ role: 'user', text });
    save();
    input.value = '';
    appendMessage('user', text);
    showTyping();
    setTimeout(() => {
      document.getElementById('typing')?.remove();
      const answer = reply(text);
      state.messages.push({ role: 'assistant', text: answer });
      save();
      appendMessage('assistant', answer);
    }, 520);
  }, true);

  document.addEventListener('click', event => {
    const suggestion = event.target.closest('.suggestions button');
    if (!suggestion) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    const text = suggestion.textContent;
    state.messages.push({ role: 'user', text });
    save();
    appendMessage('user', text);
    showTyping();
    setTimeout(() => {
      document.getElementById('typing')?.remove();
      const answer = reply(text);
      state.messages.push({ role: 'assistant', text: answer });
      save();
      appendMessage('assistant', answer);
    }, 520);
  }, true);
</script><script>
  const baseLogin = login;
  login = () => { localStorage.setItem('delms-session', Date.now()); baseLogin(); };
  const baseLogout = logout;
  logout = () => { localStorage.removeItem('delms-session'); baseLogout(); };
  const sessionStarted = Number(localStorage.getItem('delms-session') || Date.now());
  if (Date.now() - sessionStarted >= 1800000) {
    localStorage.removeItem('delms-chat');
    localStorage.removeItem('delms-session');
    location.reload();
  } else {
    localStorage.setItem('delms-session', sessionStarted);
    setTimeout(() => { localStorage.removeItem('delms-chat'); localStorage.removeItem('delms-session'); location.reload(); }, 1800000 - (Date.now() - sessionStarted));
  }
</script></body></html>
